name: Shape sweep

# The nightly benchmark job the architecture doc §10.2 names as a P0
# deliverable ("CI skeleton: build, rustfmt/clippy, ASan, --time JSON
# schema, nightly benchmark job (even if it only runs baselines)") and
# §9.3 contracts ("Nightly (wall-clock, dedicated hardware): full corpus,
# 10 runs, median and p95, vs baselines. Results stored and charted.").
#
# The committable half runs here: the parameterized corpus generator
# (pgr_fixtures::corpus) synthesizes the §9.2 corpus-table rows the tree
# can carry, the shape-sweep harness (pgr_core::sweep, the xtask sweep
# command) records ten runs per shape and reduces them to the median/p95
# walls plus the per-phase rows, and the stored ledger lines upload as
# workflow artifacts — the "results stored" half.
#
# The §9.3 correctness half rides the sweep itself: every benchmark link
# ships through the strict verifier (pgr_emit::sweep — the run-gate seam)
# before the ledger records, so the stored ledgers are earned by images
# the strict pass shipped ("performance jobs never gate on unverified
# output").
#
# The §9.3 budget gate rides in report mode here ("--budgets report" —
# the verdict renders with the ledger): the budgets' thresholds are the
# §9.1 rig job's calibration ("at 8 P-cores"), and this runner's walls
# are dev-sandbox-class numbers against tiny synthesized shapes — the
# calibrated enforce face is the rig job's (`--budgets enforce`).
#
# The §9.3 per-PR allocation-count job's allocation half rides the same
# job ("plus allocation counts per pass" — counted in CI the §10.3 M1
# gate's own wording): the allocation lane's binary (xtask-alloc — the
# DHAT seat's own process, the wall lane's baselines riding the plain
# allocator) records the per-pass counts beside the wall lane's sweeps,
# the same gated runs, the same shapes, its own stored ledgers.
#
# The rig-bound half stays named, not faked: the wall-clock comparison
# against ld-prime / ld64.lld / mold-macho baselines and the G1 gate
# need the §9.1 Apple Silicon rigs (docs/BENCHMARKS.md, "Known
# follow-ups: … rig-bound: S1 writer matrix, S4 P-core sizing, PGO, the
# G1 gate, the per-PR instruction/cache-miss counts"). This runner's
# walls are dev-sandbox-class numbers — recorded honestly, never
# compared against linker baselines that do not run here.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

concurrency:
  group: sweep-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  sweep:
    name: nightly shape sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
      - name: Build (locked, release)
        run: cargo build --release --locked --workspace
      - name: Sweep the §9.2 shapes (10 runs each — the §9.3 contract)
        run: |
          mkdir -p sweep-ledgers
          cargo run --locked -p xtask -- sweep \
            --out sweep-ledgers/many-tiny.json \
            --preset many-tiny --runs 10 --budgets report
          cargo run --locked -p xtask -- sweep \
            --out sweep-ledgers/large-debug.json \
            --preset large-debug --runs 10 --budgets report
          cargo run --locked -p xtask -- sweep \
            --out sweep-ledgers/archive-heavy.json \
            --preset archive-heavy --runs 10 --budgets report
      - name: The allocation lane sweeps the shapes (the per-pass counts)
        run: |
          cargo run --locked -p xtask --bin xtask-alloc \
            -- --out sweep-ledgers/many-tiny.allocs.json \
            --preset many-tiny --runs 10
          cargo run --locked -p xtask --bin xtask-alloc \
            -- --out sweep-ledgers/large-debug.allocs.json \
            --preset large-debug --runs 10
          cargo run --locked -p xtask --bin xtask-alloc \
            -- --out sweep-ledgers/archive-heavy.allocs.json \
            --preset archive-heavy --runs 10
      - name: The ledgers parse (the stored face's own gate)
        run: cargo test --release --locked -p pgr-core --test shape_sweep --test alloc_sweep
      - name: Upload the stored ledgers
        uses: actions/upload-artifact@v4
        with:
          name: sweep-ledgers
          path: sweep-ledgers/*.json
          retention-days: 90
