name: Fuzz

# Nightly libFuzzer runs for the parsers, the verifier and the M1 link
# pipeline (TDD §11: "a linker is a hostile-input parser; its crash is a
# build crash"). Smoke-sized runs keep cost bounded; scale -max_total_time
# up on dedicated hardware.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: cargo-fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse_any, verify_image, link_object]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            fuzz -> fuzz/target
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Seed corpus with valid fixtures
        run: |
          cargo run --locked -p pgr-fixtures --example emit_corpus -- fuzz/corpus/${{ matrix.target }}
      - name: Run (${{ matrix.target }}, 120 s)
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} \
            -- -max_total_time=120 -rss_limit_mb=4096
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: |
            fuzz/artifacts
          if-no-files-found: ignore
