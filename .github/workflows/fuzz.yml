name: Fuzz

# Nightly libFuzzer runs for the parsers (Mach-O + .tbd), the verifier and
# the link pipeline (TDD §11: "a linker is a hostile-input parser; its crash
# is a build crash"). Smoke-sized runs keep cost bounded; scale
# -max_total_time up on dedicated hardware.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: cargo-fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse_any, parse_tbd, verify_image, link_object, dyld_info_streams, cache_entries]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            fuzz -> fuzz/target
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Seed corpus with valid fixtures
        run: |
          cargo run --locked -p pgr-fixtures --example emit_corpus -- fuzz/corpus/${{ matrix.target }}
      - name: Seed .tbd corpus (parse_tbd)
        if: matrix.target == 'parse_tbd'
        run: |
          mkdir -p fuzz/corpus/parse_tbd
          printf -- '--- !tapi-tbd\ntbd-version: 4\ntargets: [ arm64-macos ]\ninstall-name: /usr/lib/libSystem.B.dylib\ncurrent-version: 1.2.3\ncompatibility-version: 1.0.0\nexports:\n  - targets: [ arm64-macos ]\n    symbols: [ _printf, _strlen ]\n    weak-symbols: [ _weakfn ]\n...\n' > fuzz/corpus/parse_tbd/libsystem-v4.tbd
          printf -- '--- !tbd-tbd-version-3.0\ntbd-version: 3\ntargets: [ arm64-macos ]\nuuids: [ arm64-macos: 1234 ]\ninstall-name: /usr/lib/libold.dylib\ncurrent-version: 1.2.3\nexports:\n  - targets: [ arm64-macos ]\n    symbols: [ _old ]\n...\n' > fuzz/corpus/parse_tbd/libold-v3.tbd
      - name: Run (${{ matrix.target }}, 120 s)
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} \
            -- -max_total_time=120 -rss_limit_mb=4096
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: |
            fuzz/artifacts
          if-no-files-found: ignore
