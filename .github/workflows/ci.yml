name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  linux:
    name: linux (x86_64) — clippy, test, doc, bench build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (warnings are errors; no lint suppression in the tree)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (locked)
        run: cargo test --workspace --locked
      - name: Docs (warnings are errors)
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Compile benchmarks (they must never rot)
        run: cargo bench --no-run --workspace --locked

  macos:
    name: macos (aarch64) — clippy, test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  determinism:
    name: determinism — double-link byte-equality on every PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
      - name: Build (locked, release)
        run: cargo build --release --locked --workspace
      - name: Double-link the shape — two processes, each run byte-compared
        run: |
          mkdir -p determinism/process-a determinism/process-b
          # Each process double-links in-process (the determinism gate
          # compares every run against the run-0 image — §9.3
          # "double-link byte-equality on every PR (TDD §4.3)") and
          # writes its run-0 image for the separate-process compare
          # (TDD §11: "link the same corpus twice in separate processes
          # → byte-identical (CI-level, every PR)").
          cargo run --locked -p xtask -- sweep \
            --out determinism/process-a/ledger.json \
            --preset many-tiny --runs 2 --budgets off \
            --determinism determinism/process-a/image.bin
          cargo run --locked -p xtask -- sweep \
            --out determinism/process-b/ledger.json \
            --preset many-tiny --runs 2 --budgets off \
            --determinism determinism/process-b/image.bin
      - name: Byte-compare the two processes' images (TDD §11)
        run: cmp determinism/process-a/image.bin determinism/process-b/image.bin
