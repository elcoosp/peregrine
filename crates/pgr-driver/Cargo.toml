[package]
name = "pgr-driver"
description = "pgr - the Peregrine linker driver (ld64-compatible CLI surface)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
pgr-format = { workspace = true }
pgr-core = { workspace = true }
pgr-emit = { workspace = true }
pgr-verify = { workspace = true }
pgr-daemon = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Option-refusal help text (the fix, not just the verdict) — the same
# miette convention the audit/object refusals render with (M10 rung 2
# wires the `-platform_version` surface through it).
miette = { workspace = true }

[dev-dependencies]
pgr-fixtures = { workspace = true }
pgr-verify = { workspace = true }
criterion = { workspace = true }

[[bin]]
name = "pgr"
path = "src/main.rs"

[lints]
workspace = true

[[bench]]
name = "link"
harness = false

[[bench]]
name = "resident"
harness = false

[[bench]]
name = "incremental"
harness = false

[[bench]]
name = "platform"
harness = false
