[package]
name = "pgr-driver"
description = "pgr - the Peregrine linker driver (ld64-compatible CLI surface)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
pgr-format = { workspace = true }
pgr-core = { workspace = true }
pgr-emit = { workspace = true }
pgr-verify = { workspace = true }
pgr-daemon = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Option-refusal help text (the fix, not just the verdict) — the same
# miette convention the audit/object refusals render with (M10 rung 2
# wires the `-platform_version` surface through it).
miette = { workspace = true }

[dev-dependencies]
pgr-fixtures = { workspace = true }
pgr-verify = { workspace = true }
criterion = { workspace = true }

[[bin]]
name = "pgr"
path = "src/main.rs"

[lints]
workspace = true

[[bench]]
name = "link"
harness = false

[[bench]]
name = "resident"
harness = false

[[bench]]
name = "incremental"
harness = false

[[bench]]
name = "platform"
harness = false

# The M44 final-output bench: the dylib link across the -final_output
# decision (the -o-path default beside the named universal path) over
# the same 16-object corpus — a shape-parity gate, the identity default
# is one string fill before Pass 0.
[[bench]]
name = "final_output"
harness = false

# The M73 verify-gate bench: the link's own gate over a linked dylib —
# the strict pass on the produced bytes (clean, corrupted and -no_adhoc
# subjects). Registered explicitly — the M34/M61 pathology
# (auto-discovery compiles the bench under the libtest harness, whose
# generated main shadows the criterion one, so it "passes" and measures
# nothing), healed here like the entries before it.
[[bench]]
name = "verify_gate"
harness = false

# The M109 fatal-warnings bench: the driver run across the exit faces
# (the advisory default beside the -fatal_warnings escalation) over the
# same warning-producing 32-object corpus — a shape-parity gate, the
# tally is a counter the faces increment as they print.
[[bench]]
name = "fatal_warnings"
harness = false

# The M133 warning-suppression bench: the driver run across the print
# faces (the advisory default beside the -w suppression) over the same
# warning-producing 32-object corpus — a shape-parity gate, the decision
# silences the `pgr: warning:` lines and never moves the tally the
# faces keep counting.
[[bench]]
name = "warn_suppress"
harness = false

# The M134 loaded-object inventory bench: the driver run across the
# `-whatsloaded` faces (the silent default beside the named inventory)
# over the same clean 32-object corpus — a shape-parity gate, the face
# prints one stderr line per loaded object and never moves the bytes.
[[bench]]
name = "whats_loaded"
harness = false

# The M135 library-search-order bench: the driver run across the
# `-search_paths_first`/`-search_dylibs_first` faces (the per-directory
# default beside the dylibs-first rounds) over the same split corpus
# (dir one's archive beside dir two's dylib) — a shape-parity gate, the
# decision names which files the link consumes and the pipeline rides
# the picked bytes either way.
[[bench]]
name = "search_paths"
harness = false

# The M136 unused-dylib advisory bench: the driver run across the
# `-warn_unused_dylibs` faces (the silent default beside the named
# advisory) over the same corpus — a shape-parity gate, the face reads
# the M42 predicate read-side and never moves the bytes.
[[bench]]
name = "warn_unused"
harness = false
