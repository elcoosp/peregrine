[package]
name = "pgr-fixtures"
description = "Deterministic Mach-O test-image builder shared across the workspace's tests, benches, examples and the fuzz corpus (not published)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
pgr-format = { workspace = true }
sha2 = { workspace = true }
# The builder refusals ride the workspace's one error derive (the
# `BuildError` Display/Error impls were the last hand-rolled pair).
thiserror = { workspace = true }

[dev-dependencies]
# The corpus gate matrix links its generated corpus in-process (the
# link-honesty gate), emits the image and strict-verifies it — the same
# read-side engine the surface tests ride.
pgr-core = { workspace = true }
pgr-emit = { workspace = true }
pgr-verify = { workspace = true }
# The corpus generation bench (the presets' price, in memory — the
# corpora contract is no I/O, no clocks).
criterion = { workspace = true }

[[bench]]
name = "corpus"
harness = false

[lints]
workspace = true
