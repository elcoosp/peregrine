[package]
name = "pgr-emit"
description = "Peregrine emit pipeline: output buffer, reloc apply, writer, ad-hoc code signature (Passes 4-5)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
pgr-format = { workspace = true }
# The workspace dependency table is the single source for inter-crate
# edges (every other member rides it); this crate's inline `path` was
# the one escape, healed as chore(deps).
pgr-core = { workspace = true }
pgr-verify = { workspace = true }
sha2 = { workspace = true }
# M114: the random UUID source's entropy (the emit draws the identity
# from the system CSPRNG at emit time).
getrandom = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
tracing = { workspace = true }
miette = { workspace = true }

[dev-dependencies]
pgr-fixtures = { workspace = true }
criterion = { workspace = true }
# The M13 record-summary example installs a subscriber under
# PGR_TRACING=1 so the read-refusal spans are watchable (the workspace
# convention — the crate's first consumer example).
tracing-subscriber = { workspace = true }

[[bench]]
name = "emit"
harness = false

[[bench]]
name = "propagate"
harness = false

[[bench]]
name = "object"
harness = false

# The M13 record-inspector bench: the read surface (frame + decode,
# summary render) beside the write side it mirrors, over one real
# recorded link.
[[bench]]
name = "record_summary"
harness = false

[lints]
workspace = true

# The §9.3 verify-gate bench (the "Correctness stays first" row: the
# sweep's correctness half) — the fused emit beside the emit-plus-strict
# verify over the same corpus (the gate's overhead is the verifier's
# whole-image pass) and one verified sweep run beside the plain sweep.
# The bench measures the gate's own price, not a verdict — the gate
# matrix is the `verified_sweep` tests.
[[bench]]
name = "verified_sweep"
harness = false
