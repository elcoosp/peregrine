[package]
name = "pgr-daemon"
description = "Peregrine resident link server (pgrd) and client: persistent parse state across links (architecture doc §7.2, M8)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
pgr-core = { workspace = true }
pgr-emit = { workspace = true }
pgr-format = { workspace = true }
# The served verify verdict (M72, wire v43): the session runs the strict
# verifier on the final bytes when the request asks — the audit's own
# read-side engine, now answering on the wire (promoted from a
# dev-dependency, which rode for the pgrd binary test's verifier gate).
pgr-verify = { workspace = true }
sha2 = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
pgr-fixtures = { workspace = true }
criterion = { workspace = true }

[lints]
workspace = true

# The M59 wire-tail bench: the time report's encode/decode price over a
# served-shape report (the warm pipeline's phases, the notes, the bands) —
# a shape gate, the tail is a handful of scalars beside an image that
# carries pages.
[[bench]]
name = "wire_time"
harness = false

# The M62 trace-tail bench: the rendered timeline's encode/decode price
# (the document rides the reply verbatim). Registered explicitly — the
# M34/M61 pathology (auto-discovery compiles the bench under the libtest
# harness, whose generated main shadows the criterion one, so it
# "passes" and measures nothing), healed here like the M34 and M61
# entries before it.
[[bench]]
name = "wire_trace"
harness = false

# The M72 verify-tail bench: the served verdict's encode/decode price
# (the M13 interchange document rides the reply verbatim, the strict
# reader its own face). Registered explicitly — the same M34/M61
# pathology, healed here like the entries before it.
[[bench]]
name = "wire_verify"
harness = false

[[bin]]
name = "pgrd"
path = "src/main.rs"
