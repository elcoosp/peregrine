# the corpus size, so the honest expectation is near-parity with the
# unobserved link) and the two faces' render price over a fixed report —
# a shape gate, the render is O(rows).
[[bench]]
name = "time_report"
harness = false

# The M60 dependency-record bench: the sidecar's own price — the
# eager-sorted insert, the render (the version row plus one
# NUL-terminated row per entry) and the strict reader's decode over
