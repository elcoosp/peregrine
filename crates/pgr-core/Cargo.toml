[package]
name = "pgr-core"
description = "Peregrine core pipeline: interner, symbol table, resolution, layout, fixups (Passes 1-3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
sha2 = { workspace = true }
pgr-format = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
# Debug spans on the layout path (inert until a subscriber installs —
# the binaries do under their debug envs; the old PGR_DEBUG_LAYOUT
# eprintln block became spans when the workspace adopted tracing).
tracing = { workspace = true }

[dev-dependencies]
pgr-fixtures = { workspace = true }
criterion = { workspace = true }
# The consumer example installs a subscriber under PGR_TRACING=1 so the
# resolve-reuse seams (`resolve_reuse_plan`/`resolve_reuse_install`) are
# watchable — the same inert-until-subscriber convention the binaries use.
tracing-subscriber = { workspace = true }

[[bench]]
name = "trie"
harness = false

[[bench]]
name = "resolve"
harness = false

[[bench]]
name = "platform"
harness = false

# The rung-4 word-family bench (M10 rung 4, slice 2): the same slot
# corpus planned as 64_OFFSET and ARM64E words.
[[bench]]
name = "arm64e"
harness = false

# The M11 order-file bench: the same corpus laid out with and without a
# rank table (the atom split plus one stable sort per bucket).
[[bench]]
name = "order"
harness = false

# The M11 link-map bench: the plan rendered to the structured map and
# its deterministic text (a reporting seam, kept off the hot path).
[[bench]]
name = "map"
harness = false

# The M14 export-filter bench: the visibility closure's match cost per
# family (exact vs one-star vs two-star) over the same name universe.
[[bench]]
name = "filter"
harness = false

# The M14 rung-2 dylib-surface bench: the link across the load-command
# kinds (load vs weak vs lazy) over the same 256-bind corpus — a
# shape-parity gate, the kind is one header opcode per dylib.
[[bench]]
name = "dylibs"
harness = false

# The M15 image-base bench: the link across the -pagezero_size
# decisions (the 4 GiB default, a 1 GiB and a 16 MiB base) over the
# same 64-object corpus — a shape-parity gate, the base is address
# arithmetic on the plan.
[[bench]]
name = "pagezero"
harness = false

# The M16 initializer-offsets bench: the link across the initializer
# forms (the classic pointer sections, the __init_offsets transform)
# and both fixup paths (chained, classic opcode streams) over the same
# 32-object corpus — a shape-parity gate, the transform is a
# bucketing-time removal plus one synthetic u32 piece.
[[bench]]
name = "init_offsets"
harness = false

# The M17 segment-protection bench: the link across the -segprot
# decisions (the house table, a read-only-after-rebase __DATA_CONST, a
# writable __TEXT ceiling) over the same 64-object corpus — a
# shape-parity gate, the protections are two field writes per planned
# segment.
[[bench]]
name = "segprot"
harness = false

# The M18 stack-reserve bench: the link across the -stack_size
# decisions (the zero default, a 16 MiB and a 1 GiB reserve) over the
# same 64-object corpus — a shape-parity gate, the reserve is one field
# write in the 24-byte LC_MAIN.
[[bench]]
name = "stack_size"
harness = false

# The M19 image-base bench: the link across the -image_base decisions
# (the M3 zero default, a 512 KiB and a 2 GiB base) over the same
# 64-object dylib corpus — a shape-parity gate, the base is the
# constant-delta address arithmetic every pass already rides.
[[bench]]
name = "image_base"
harness = false

# The M20 umbrella-region bench: the link across the -sub_umbrella/
# -sub_library decisions (the empty table, 8 and 64 members) over the
# same 64-object dylib corpus — a shape-parity gate, a member is one
# 16-32 byte region command in the identity block.
[[bench]]
name = "umbrella"
harness = false

# The M21 sub-client bench: the link across the -sub_client decisions
# (the empty list, 8 and 64 clients) over the same 64-object dylib
# corpus — a shape-parity gate, a client is one 16-24 byte LC_SUB_CLIENT
# command in the identity block.
[[bench]]
name = "sub_client"
harness = false

# The M22 dyld-environment bench: the link across the -dyld_env
# decisions (the empty list, 8 and 64 pairs) over the same 64-object
# executable corpus — a shape-parity gate, a pair is one 16-32 byte
# LC_DYLD_ENVIRONMENT command in the loader-configuration block.
[[bench]]
name = "dyld_env"
harness = false

# The M24 symbol-alias bench: the link across the -alias decisions
# (the empty table, 8 and 64 aliases) over the same 64-object
# executable corpus — a shape-parity gate, an alias is one extra
# symtab row and one trie terminal per decision.
[[bench]]
name = "alias"
harness = false

# The M25 bundle-loader bench: the link across the -bundle_loader
# decisions (the dynamic-lookup default beside a 64-export loader
# surface) over the same 64-object bundle corpus — a shape-parity
# gate, a loader decision is a Pass-2 set insert and one ordinal arm
# per bind.
[[bench]]
name = "bundle_loader"
harness = false

# The M26 loader-path bench: the link across the -dylinker decisions
# (the hard-coded default beside a short and a 200-byte named path)
# over the same 64-object executable corpus — a shape-parity gate, a
# decision is one string swap in the LC_LOAD_DYLINKER command the
# header already emits.
[[bench]]
name = "dylinker"
harness = false

# The M27 PIE bench: the link across the -no_pie decisions (the PIE
# default beside the dropped bit) over the same 64-object executable
# corpus — a shape-parity gate, the decision is one bit in one header
# word.
[[bench]]
name = "pie"
harness = false

# The M28 sect-align bench: the link across the -sectalign decisions
# (the empty default table beside raised floors over the same corpus) —
# the default is a shape-parity gate (an empty table plans the pre-M28
# bytes), the raised floors price the packing loop's realignment.
[[bench]]
name = "sect_align"
harness = false

# The M29 header-pad bench: the link across the -headerpad decisions
# (the natural region beside the named floor over the same corpus) —
# the natural region is a shape-parity gate (an unnamed pad plans the
# pre-M29 bytes), the named floor prices the packing loop's
# reservation.
[[bench]]
name = "header_pad"
harness = false

[lints]
workspace = true
