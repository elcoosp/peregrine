[lints]
workspace = true

# The M56 provenance bench: the -why_export query's price — the M8-a
# reverse index's once-per-link build and the query's own read against
# the built index — over the resolve bench's 64-object corpus. A shape
# gate (the seam re-derives nothing; the site records are the corpus's
# own edges), not a link-cost knob.
[[bench]]
name = "provenance"
harness = false

