[package]
name = "pgr-verify"
description = "Peregrine read-side verifier: structural checks, segment contract, chain-walk simulation, signature recompute (M0)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
pgr-format = { workspace = true }
sha2 = { workspace = true }
# Typed error surfaces (the report-JSON reader's refusals — M13 rung 1;
# every other crate's errors ride the same derive).
thiserror = { workspace = true }
# The arm64e walk names its contract on the tracing seam (inert until a
# subscriber installs — the driver and the consumer examples install one
# under their debug envs; M10 rung 4, slice 1).
tracing = { workspace = true }

[dev-dependencies]
pgr-fixtures = { workspace = true }
object = { workspace = true }
proptest = { workspace = true }
# The rung-3 floor-gate bench (the first bench in the crate): the strict
# verify pass over below-floor and at-floor chained-fixup images, with
# the workspace's criterion pin (0.7 needs `cargo_bench_support` to
# actually measure).
criterion = { workspace = true }
# The rung-4 consumer example installs a subscriber under PGR_TRACING=1
# so the arm64e walk spans are watchable (the workspace convention).
tracing-subscriber = { workspace = true }

[[bin]]
name = "pgr-verify"
path = "src/main.rs"

# The platform-floor gate bench (M10 rung 3, slice 2).
[[bench]]
name = "platform"
harness = false

# The arm64e strict-pass bench (M10 rung 4, slice 1).
[[bench]]
name = "arm64e"
harness = false

# The M12 selective-surface bench: the whole-image pass beside each
# single check family on one at-floor chained-fixup executable.
[[bench]]
name = "checks"
harness = false

# The M13 baseline-gate bench: the delta's per-policy cost and the
# report JSON's write/read beside one real verify pass (for scale).
[[bench]]
name = "baseline"
harness = false

[lints]
workspace = true
