# Project-local cargo configuration.
# CI mirrors these aliases; keep them in sync with .github/workflows/ci.yml.
[alias]
# Strict lint gate: warnings are errors, all targets (incl. tests/benches).
lint = "clippy --workspace --all-targets -- -D warnings"
lint-fix = "clippy --workspace --all-targets --fix --allow-dirty"
# Fast gate used while iterating.
fast-check = "check --workspace --all-targets"
