[package]
name = "xtask"
description = "The workspace's developer commands (the parameterized corpus generator's and the shape-sweep harness's CLI; not published)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
# Two lane binaries share the crate (the sweep lanes' shared flag
# surface and corpus projection ride the lib target): the wall lane's
# `xtask` stays the default `cargo run -p xtask` face, and the
# allocation lane's `xtask-alloc` is the counted seat's own process —
# the seat is process-global, the wall lane's baselines ride the plain
# allocator.
default-run = "xtask"

[[bin]]
name = "xtask"
path = "src/main.rs"

[[bin]]
name = "xtask-alloc"
path = "src/bin/alloc.rs"

[dependencies]
pgr-fixtures = { workspace = true }
# The sweep command drives the harness seam (pgr_core::sweep) over the
# generated corpus — the pipeline face the nightly job's ledger rides.
pgr-core = { workspace = true }
# The §9.3 correctness half: the nightly's sweep rides the verify gate
# (pgr_emit::sweep) — every benchmark link ships through the strict
# verifier before the ledger records.
pgr-emit = { workspace = true }
pgr-verify = { workspace = true }
# The allocation lane's seat (the §9.3 per-PR allocation-count job):
# `dhat::Alloc` is the counting allocator the `xtask-alloc` binary
# installs — the wall lane's binary never records (its walls stay the
# plain allocator's; the seat's bookkeeping would ride them).
dhat = { workspace = true }

[lints]
workspace = true
