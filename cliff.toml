# git-cliff configuration (Conventional Commits, Keep a Changelog layout).
# CI uses this for release notes (.github/workflows/release.yml) and the
# repository keeps a generated CHANGELOG.md.

[changelog]
# Header block for the generated file.
header = """
# Changelog

All notable changes to Peregrine are documented here. The format is based on
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and the project
adopts [Conventional Commits](https://www.conventionalcommits.org/) for
release automation.
"""
# Footer: prevents tool-generated section from being edited by hand.
footer = """
<!-- generated by git-cliff -->
"""
# Group commits by conventional type, ordered as below.
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}\
{% else %}\
    ## [Unreleased]\
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}\
    ### {{ group | upper_first }}\n\
    {% for commit in commits %}\
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {{ commit.message | upper_first }} \
            {% if commit.breaking %} (**breaking**){% endif %}\
            ({{ commit.id | truncate(length=7, end="") }})\
    {% endfor %}\n\
{% endfor %}\n
"""
# Remove leading/trailing whitespace from the output.
trim = true

[git]
# Parse conventional commits; ignore anything else.
conventional_commits = true
filter_unconventional = true
split_commits = false
# Protect the generated changelog from self-reference.
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^test", group = "Tests" },
    { message = "^doc", group = "Documentation" },
    { message = "^refactor", group = "Refactor" },
    { message = ".*\\(fuzz\\)", group = "Fuzzing" },
    { message = "^ci", group = "Continuous Integration" },
    { message = "^build", group = "Build" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "Miscellaneous Tasks" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "newest"
